# CI for the three services: lint, test, scan code, build, scan image, push.
# Runs on every push to main. Any CRITICAL finding stops the pipeline.
name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install lint tools
        run: npm ci

      - name: Lint all services
        run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, product, order]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install libraries
        run: npm ci

      - name: Run unit tests
        run: npm test

  scan-code:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Scan libraries and secrets with Trivy (fail on CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" \
            aquasec/trivy:0.74.0 fs \
            --scanners vuln,secret --severity CRITICAL --exit-code 1 --no-progress \
            /src

  build-scan-push:
    needs: scan-code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, product, order]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Work out image tag (commit ID)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/ecommerce-${{ matrix.service }}
          tags: type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: scan-target:${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy (fail on CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --scanners vuln --severity CRITICAL --exit-code 1 --no-progress \
            scan-target:${{ matrix.service }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

  update-config:
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the config repo
        uses: actions/checkout@v4
        with:
          repository: Thormie-Harshey/ecommerce-gitops-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Write the new tag into the staging overlay
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i "s|newTag: .*|newTag: ${TAG}|" overlays/staging/kustomization.yaml
          grep newTag overlays/staging/kustomization.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlays/staging/kustomization.yaml
          git diff --cached --quiet && echo "Tag unchanged, nothing to commit" && exit 0
          git commit -m "staging: deploy ${GITHUB_SHA::7} from ecommerce-gitops-app"
          git pull --rebase
          git push
